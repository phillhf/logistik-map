name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: JavaScript-Syntax prüfen
        shell: bash
        run: for f in logistikmap/static/js/*.js; do node --check "$f"; done

  oberflaeche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - run: pip install -r requirements-e2e.txt
      - run: python -m playwright install --with-deps chromium
      - name: Oberflächentests im Browser
        run: E2E=1 SCREENSHOTS=1 python -m pytest -q tests/e2e --tracing retain-on-failure
      - name: Screenshots und Fehlerspuren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oberflaeche
          path: |
            docs/screenshots
            test-results
