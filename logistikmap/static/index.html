<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logistik Map</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="kopf" hidden>
    <a class="marke" href="#/karte">
      <img src="favicon.svg" alt="" width="24" height="24">
      <span>Logistik Map</span>
    </a>
    <nav id="navigation"></nav>
    <div class="benutzermenue">
      <button type="button" id="benutzer-knopf" class="knopf-flach"></button>
      <div id="benutzer-liste" class="aufklapp" hidden>
        <button type="button" data-aktion="passwort" data-i18n="menue.passwort_aendern"></button>
        <button type="button" data-aktion="abmelden" data-i18n="menue.abmelden"></button>
      </div>
    </div>
  </header>
  <main id="inhalt"></main>
  <div id="meldungen" aria-live="polite"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
